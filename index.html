<style>
:root{
  --desk:#1c2427;--desk2:#26333a;--paper:#f1e6cc;--paper2:#e2d0a8;--ink:#2a2119;--muted:#6f604b;
  --red:#b3261e;--green:#1f6f4f;--green2:#2b8a60;--gold:#c79a3a;--line:rgba(42,33,25,.13);--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Tajawal,sans-serif;background:var(--desk);background-image:radial-gradient(circle at 15% -10%,#33454c 0,transparent 55%),radial-gradient(circle at 100% 110%,#203230 0,transparent 50%);background-attachment:fixed;color:var(--paper);min-height:100vh;line-height:1.75;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font-family:inherit;font-size:15px}
h1,h2,h3,.kufi{font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.screen{display:none}.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s 2}
.small{font-size:13px}.mt{margin-top:16px}.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}

/* paper + folders */
.paper{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:22px;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.35);background-image:linear-gradient(transparent 31px,var(--line) 32px);background-size:100% 32px}
.paper.plain{background-image:none}
.folder{margin-top:24px;border-top-right-radius:0}
.folder::before{content:attr(data-tab);position:absolute;top:-24px;right:0;background:var(--paper);color:var(--muted);font-size:13px;font-weight:800;padding:3px 20px 4px;border-radius:12px 12px 0 0}
.stamp{position:absolute;top:18px;left:18px;border:3px double var(--red);color:var(--red);font-family:'Noto Kufi Arabic';font-weight:700;padding:1px 12px;border-radius:6px;transform:rotate(-9deg);opacity:.85;font-size:15px;pointer-events:none}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:1px 10px;border-radius:20px;background:rgba(42,33,25,.08);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.3;background:var(--green);color:#fff;padding:13px 22px 9px;border-radius:10px;font-weight:800;font-size:15px;transition:.15s}
.btn:hover{background:var(--green2)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.85}
.btn.ghost:hover{opacity:1;background:rgba(127,127,127,.08)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.red{background:var(--red)}
.btn.sm{padding:8px 15px 4px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.inp{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid rgba(42,33,25,.25);background:#fbf6ea;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--green)}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 4px}
label.f small{font-weight:500;color:var(--muted)}

/* login */
.login{max-width:520px;margin:6vh auto 0}
.brand{text-align:center;margin-bottom:26px}
.brand .lens{font-size:54px;display:block}
.brand h1{font-size:34px;color:var(--paper)}
.brand p{opacity:.75}
.login .paper h2{font-size:22px;margin-bottom:6px}
.tlink{display:block;margin:18px auto 0;font-size:14px;opacity:.7;text-decoration:underline}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.top .logo{font-family:'Noto Kufi Arabic';font-size:20px;font-weight:700}
.top .logo span{opacity:.6;font-size:14px;font-family:Tajawal;font-weight:500}

/* HQ */
.hqTop{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.idcard{display:flex;gap:16px;align-items:center}
.avatar{width:74px;height:74px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-size:36px;flex-shrink:0;border:3px solid var(--gold)}
.idcard h2{font-size:22px}
.bar{height:9px;background:rgba(42,33,25,.12);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:9px;transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(241,230,204,.08);border:1px solid rgba(241,230,204,.15);border-radius:var(--r);padding:14px;text-align:center}
.stat b{display:block;font-family:'Noto Kufi Arabic';font-size:28px;color:var(--gold)}
.stat small{opacity:.75}
.weekly{margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(199,154,58,.22),rgba(199,154,58,.06));border:1px dashed var(--gold);border-radius:var(--r);padding:14px 18px}
.weekly .pin{font-size:28px}
.weekly .txt{flex:1;min-width:200px}
.weekly b{font-family:'Noto Kufi Arabic';font-size:18px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.mapbox h3,.badges h3{font-size:17px;margin-bottom:8px}
.mapbox svg{width:100%;height:auto;display:block}
.mapPin{cursor:pointer}
.mapPin:hover circle.p{r:12}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.badge{text-align:center;padding:10px 4px;border-radius:12px;background:rgba(42,33,25,.05)}
.badge .i{font-size:32px;display:block}
.badge small{font-weight:700;font-size:12px;display:block;line-height:1.4}
.badge.off .i{filter:grayscale(1);opacity:.3}
.badge.off small{opacity:.45}
.sec{margin:30px 0 4px;font-size:22px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px 16px}
.case{display:flex;flex-direction:column;gap:6px;min-height:200px}
.case h3{font-size:18px}
.case .era{font-size:13px;color:var(--muted)}
.case .foot{margin-top:auto;padding-top:10px}
.case.locked{filter:saturate(.3);opacity:.7}
.case .stamp.done{border-color:var(--green);color:var(--green)}
.stars{color:var(--gold);letter-spacing:2px}

/* case screen */
.casebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.casebar .ct{flex:1;min-width:180px}
.casebar .ct small{display:block;opacity:.65;font-size:13px}
.casebar .ct b{font-family:'Noto Kufi Arabic';font-size:20px}
.pill{background:rgba(241,230,204,.1);border:1px solid rgba(241,230,204,.2);border-radius:20px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.pill.warn{background:var(--red);border-color:var(--red)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:22px}
.st{text-align:center;font-size:13px;font-weight:700;opacity:.5;padding-top:6px;border-top:4px solid rgba(241,230,204,.2)}
.st span{display:block;font-family:'Noto Kufi Arabic';font-size:15px}
.st.act{opacity:1;border-color:var(--gold);color:var(--gold)}
.st.done{opacity:.85;border-color:var(--green2)}
.brief{font-size:17px;margin:10px 0 14px;max-width:760px}
.mystery{background:rgba(179,38,30,.08);border-right:4px solid var(--red);padding:12px 16px;border-radius:8px;font-size:17px;margin-bottom:14px}
.mission{padding-right:22px;margin-bottom:12px}
.mission li{margin:2px 0}

/* evidence */
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px;margin-top:12px}
.ev{perspective:900px;cursor:pointer}
.ev .in{display:grid;transition:transform .55s;transform-style:preserve-3d}
.ev .back,.ev .front{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:16px;min-height:200px}
.ev .back{background:#8a6a3c;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 8px,transparent 8px 16px);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed rgba(241,230,204,.4)}
.ev .back .tp{font-size:38px}
.ev .back small{opacity:.8}

.mcols>div{display:flex;flex-direction:column;gap:8px}
.mi{background:#fbf5e6;border:1.5px solid rgba(42,33,25,.2);color:var(--ink);padding:10px 12px;border-radius:10px;font-weight:700;font-size:14.5px;text-align:right;transition:.15s}
.mi:hover:not(:disabled){border-color:var(--gold)}
.mi.sel{background:var(--gold);border-color:var(--gold)}
.mi.ok{background:rgba(31,111,79,.12);border-color:var(--green);color:var(--green);cursor:default}
.mi.bad{background:rgba(179,38,30,.12);border-color:var(--red)}

/* puzzle */
.subs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subs span{font-size:13px;font-weight:800;padding:3px 12px;border-radius:20px;background:rgba(42,33,25,.07);color:var(--muted)}
.subs span.act{background:var(--ink);color:var(--paper)}
.subs span.done{background:rgba(31,111,79,.15);color:var(--green)}
.subs span.done::before{content:'✓ '}
.q{font-size:20px;margin:8px 0 14px}
.opts{display:grid;gap:10px}
.opt{background:#fbf5e6;border:1.5px solid rgba(42,33,25,.2);color:var(--ink);padding:13px 16px;border-radius:12px;text-align:right;font-weight:700;font-size:16px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(-3px)}
.opt.ok{background:var(--green);color:#fff;border-color:var(--green)}
.opt.bad{background:rgba(179,38,30,.1);border-color:var(--red);color:var(--red);text-decoration:line-through}
.hintBox{margin-top:12px;background:rgba(199,154,58,.18);border-radius:10px;padding:10px 14px;font-weight:700}
.slots{display:grid;gap:8px;margin:12px 0}
.slot{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:10px;border:2px dashed rgba(42,33,25,.25);color:var(--muted)}
.slot .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:'Noto Kufi Arabic';flex-shrink:0}
.slot.fill{border-style:solid;background:#fbf5e6;color:var(--ink);font-weight:700;cursor:pointer}
.slot.ok{border-color:var(--green);background:rgba(31,111,79,.1)}
.slot.bad{border-color:var(--red);background:rgba(179,38,30,.1)}
.slot .d{color:var(--green);font-family:'Noto Kufi Arabic';font-size:14px;white-space:nowrap}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;font-weight:700;font-size:14.5px;text-align:right}

.cert .stars{font-size:26px}
.cert .stamp{top:auto;bottom:22px;left:22px}
.summary{max-width:720px;margin:18px auto 0}
.endbtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,14,16,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}

.tabs{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}

.tabs button.on{background:var(--ink);color:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid rgba(42,33,25,.15);text-align:right}
th{background:rgba(42,33,25,.06)}
.revlist{display:grid;gap:10px;margin-top:10px}
.revlist div{background:#fbf5e6;border-radius:10px;padding:10px 14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--paper);padding:11px 22px;border-radius:30px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:.3s;z-index:60;max-width:calc(100% - 32px);text-align:center}

footer{text-align:center;opacity:.5;font-size:13px;margin-top:40px}

const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const KEY='history_detective_v1';
let DB=load(),me=null,G=null,timerId=null;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.settings)return d}catch(e){}
  return{students:{},settings:{weekly:'c1',note:'مرتبطة بدرس: الدولة السعودية الأولى',minutes:10,pin:'1234'},custom:[],last:''}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const allCases=()=>[...BASE,...(DB.custom||[])];
const student=()=>DB.students[me]||(DB.students[me]={solved:{}});
const rankOf=n=>[...RANKS].reverse().find(r=>n>=r[0]);
function unlocked(c,i,cs){return i===0||c.id===DB.settings.weekly||!!student().solved[cs[i-1].id]}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}

function renderHQ(){
  const cs=allCases(),st=student();
  const done=cs.filter(c=>st.solved[c.id]);
  const pts=done.reduce((s,c)=>s+st.solved[c.id].score,0);
  const r=rankOf(done.length),nx=RANKS.find(x=>x[0]>done.length);
  const w=cs.find(c=>c.id===DB.settings.weekly)||cs[0];
  const pct=cs.length?Math.round(done.length/cs.length*100):0;
  $('#hqBody').innerHTML=`
  <div class="hqTop">
    <div class="paper plain idcard">
      <div class="avatar">${r[2]}</div>
      <div style="flex:1">
        <span class="chip">بطاقة المحققة</span>
        <h2>${esc(me)}</h2>
        <div><b>${r[1]}</b> <span class="muted small">${nx?`· باقي ${AR(nx[0]-done.length)} لتصبحي «${nx[1]}»`:'· أعلى رتبة 👑'}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <small class="muted">أنجزتِ ${AR(done.length)} من ${AR(cs.length)} قضايا</small>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>${AR(done.length)}</b><small>قضايا مكتملة</small></div>
      <div class="stat"><b>${AR(pts)}</b><small>نقطة</small></div>
      <div class="stat"><b>${AR(done.reduce((s,c)=>s+st.solved[c.id].stars,0))}</b><small>نجمة</small></div>
    </div>
  </div>
  <div class="weekly">
    <span class="pin">📌</span>
    <div class="txt"><small>قضية الأسبوع</small><br><b>${esc(w.title)}</b><br><small style="opacity:.8">${esc(DB.settings.note||'')}</small></div>
    <button class="btn gold" onclick="openCase('${w.id}')">${st.solved[w.id]?'أعيدي التحقيق':'ابدئي القضية'} ←</button>
  </div>
  <div class="grid2">
    <div class="paper plain mapbox"><h3>🗺️ خريطة القضايا</h3>${mapSVG(cs,st)}
      <div class="legend">${cs.filter(c=>c.place).map(c=>`<span>${st.solved[c.id]?'✅':'📍'} ${esc(c.code)}: ${esc(c.title)}</span>`).join('')}</div></div>
    <div class="paper plain badges"><h3>🎖️ خزانة الأوسمة</h3>
      <div class="bgrid">${cs.map(c=>`<div class="badge ${st.solved[c.id]?'':'off'}"><span class="i">${c.badge.icon}</span><small>${st.solved[c.id]?esc(c.badge.name):'وسام مخفي'}</small></div>`).join('')}</div></div>
  </div>
  <h2 class="sec">📂 ملفات القضايا</h2>
  <div class="cases">${cs.map((c,i)=>caseCard(c,i,cs,st)).join('')}</div>`;
}
function caseCard(c,i,cs,st){
  const s=st.solved[c.id],u=unlocked(c,i,cs);
  return `<div class="paper folder case ${u?'':'locked'}" data-tab="${esc(c.code||'قضية')}">
    ${s?`<div class="stamp done">تم الحل</div>`:c.id===DB.settings.weekly?`<div class="stamp">قضية الأسبوع</div>`:''}
    <span class="chip" style="align-self:flex-start">${esc(c.level)}</span>
    <h3>${esc(c.title)}</h3><div class="era">⏳ ${esc(c.era)}</div>
    <div class="foot row between">
      ${s?`<span class="stars">${'★'.repeat(s.stars)}${'☆'.repeat(3-s.stars)}</span><button class="btn sm ghost" onclick="openCase('${c.id}')">إعادة</button>`
        :u?`<button class="btn sm" onclick="openCase('${c.id}')">افتحي الملف ←</button>`
        :`<span class="muted small">🔒 أكملي القضية السابقة لفتحها</span>`}
    </div></div>`;
}

/* ================= القضية ================= */
function openCase(id){
  const cs=allCases(),i=cs.findIndex(x=>x.id===id),c=cs[i];
  if(!c)return;
  if(!unlocked(c,i,cs))return toast('🔒 هذه القضية مقفلة — أكملي القضية السابقة أولًا');
  const m=Math.max(3,+DB.settings.minutes||10);
  G={c,stage:1,opened:new Set(),mOrder:null,matched:[],sel:null,sub:'quiz',q:0,qo:null,qh:false,tl:null,pool:null,tlDone:false,co:null,mistakes:0,hints:0,left:m*60,timeUp:false};
  show('case');startTimer();renderCase();
}
function leaveCase(){if(G&&G.stage<4&&!confirm('هل تريدين مغادرة القضية؟ سيضيع تقدمك فيها.'))return;stopTimer();G=null;renderHQ();show('hq')}
function go(s){G.stage=s;renderCase();scrollTo({top:0,behavior:'smooth'})}
function renderHead(){
  const c=G.c;
  $('#caseHead').innerHTML=`<button class="btn ghost sm" onclick="leaveCase()">→ المقر</button>
    <div class="ct"><small>${esc(c.code||'')} · ${esc(c.level)}</small><b>${esc(c.title)}</b></div>
    <div class="row">${G.stage<4?`<span class="pill" id="tmr"></span>`:''}<span class="pill">💡 ${AR(G.hints)}</span>${G.stage===3?`<button class="btn sm gold" onclick="reviewEv()">📂 راجعي الأدلة</button>`:''}</div>`;
  $('#steps').innerHTML=STEPS.map((s,i)=>`<div class="st ${i+1<G.stage?'done':i+1===G.stage?'act':''}"><span>${i+1<G.stage?'✓':AR(i+1)}</span>${s}</div>`).join('');
  tick();
}
function renderCase(){renderHead();$('#caseBody').innerHTML=[null,stBrief,stEvidence,stPuzzle,stCert][G.stage]()}
function useHint(){G.hints++;renderHead()}
function miss(){G.mistakes++}

/* المؤقت */
function startTimer(){stopTimer();timerId=setInterval(()=>{if(!G)return;if(G.left>0){G.left--;if(G.left===0){G.timeUp=true;toast('⏱ انتهى الوقت! أكملي القضية، لكن دون نقاط السرعة')}}tick()},1000)}
function stopTimer(){clearInterval(timerId);timerId=null}
function tick(){const e=$('#tmr');if(!e||!G)return;const m=Math.floor(G.left/60),s=G.left%60;
  e.textContent=G.timeUp?'⏱ انتهى الوقت':`⏱ ${AR(m)}:${AR(String(s).padStart(2,'0'))}`;e.classList.toggle('warn',!G.timeUp&&G.left<60)}

/* ١) ملف القضية */
function stBrief(){const c=G.c;
  return `<div class="paper folder" data-tab="ملف القضية"><div class="stamp">سري للغاية</div>
    <span class="chip">⏳ ${esc(c.era)}</span>
    <h2 style="font-size:26px;margin-top:6px">${esc(c.title)}</h2>
    <p class="brief">${esc(c.brief)}</p>
    <div class="mystery"><b>🔎 اللغز:</b> ${esc(c.question)}</div>
    <b>مهمتكِ أيتها المحققة:</b>
    <ol class="mission"><li>افتحي جميع الأدلة واقرئيها بعناية.</li><li>اربطي المعلومات ببعضها.</li><li>أجيبي عن الأسئلة، ورتّبي الأحداث زمنيًا، واختاري الاستنتاج الصحيح.</li></ol>
    <p class="muted small">⏱ أنهي القضية خلال ${AR(Math.max(3,+DB.settings.minutes||10))} دقائق لتحصلي على نقاط السرعة. التلميحات متاحة دائمًا، لكن كل تلميح يخصم من نقاطك.</p>
    <button class="btn mt" onclick="go(2)">افتحي ملف الأدلة ←</button></div>`}

/* ٢) جمع الأدلة */
function stEvidence(){const c=G.c,n=c.evidence.length,all=G.opened.size===n;
  let h=`<div class="paper plain"><div class="row between"><h3>🗂️ الأدلة <span id="evCnt">(${AR(G.opened.size)}/${AR(n)})</span></h3><span class="muted small">اضغطي على كل بطاقة لفتحها</span></div>
  <div class="evs">${c.evidence.map((e,i)=>`<div class="ev ${G.opened.has(i)?'open':''}" onclick="openEv(${i},this)"><div class="in">
    <div class="back"><span class="tp">${TICON[e.type]||'📁'}</span><b>دليل رقم ${AR(i+1)}</b><small>${esc(e.type)}</small></div>
    <div class="front"><div class="evh"><span>${e.icon||TICON[e.type]||'📁'}</span><small class="chip">${esc(e.type)}</small></div><b>${esc(e.title)}</b><p>${esc(e.text)}</p></div>
  </div></div>`).join('')}</div></div>`;
  if(all){
    if(!G.mOrder)G.mOrder=shuffle(c.match.map((_,i)=>i));
    const fin=G.matched.length===c.match.length;
    h+=`<div class="paper plain mt" id="matchBox"><h3>🧵 اربطي الأدلة ببعضها</h3>
    <p class="muted small">اختاري معلومة من العمود الأول، ثم ما يناسبها من العمود الثاني.</p>
    <div class="mcols"><div>${c.match.map((m,i)=>`<button class="mi ${G.matched.includes(i)?'ok':''} ${G.sel===i?'sel':''}" onclick="pickA(${i})" ${G.matched.includes(i)?'disabled':''}>${esc(m[0])}</button>`).join('')}</div>
    <div>${G.mOrder.map(i=>`<button class="mi ${G.matched.includes(i)?'ok':''}" id="mb${i}" onclick="pickB(${i})" ${G.matched.includes(i)?'disabled':''}>${esc(c.match[i][1])}</button>`).join('')}</div></div>
    <div class="row mt">${fin?`<span style="color:var(--green);font-weight:800">✓ أحسنتِ! كل الخيوط متصلة.</span><button class="btn" onclick="go(3)">انتقلي إلى حل اللغز ←</button>`:`<button class="btn ghost sm" onclick="hintMatch()">💡 تلميح</button>`}</div></div>`;
  }
  return h;
}
function openEv(i,el){if(G.opened.has(i))return;G.opened.add(i);el.classList.add('open');
  const n=G.c.evidence.length;$('#evCnt').textContent=`(${AR(G.opened.size)}/${AR(n)})`;
  if(G.opened.size===n)setTimeout(()=>{renderCase();setTimeout(()=>$('#matchBox')?.scrollIntoView({behavior:'smooth',block:'start'}),50)},750)}
function pickA(i){G.sel=G.sel===i?null:i;renderCase()}
function pickB(i){if(G.sel===null)return toast('اختاري من العمود الأول أولًا');
  if(i===G.sel){G.matched.push(i);G.sel=null;renderCase();if(G.matched.length===G.c.match.length)toast('🧵 ربطتِ جميع الأدلة!')}
  else{miss();const b=$('#mb'+i);b.classList.add('bad','shake');setTimeout(()=>b.classList.remove('bad','shake'),700)}}
function hintMatch(){const i=G.c.match.findIndex((_,k)=>!G.matched.includes(k));if(i<0)return;G.matched.push(i);G.sel=null;useHint();renderCase();toast('💡 ربطنا لكِ خيطًا واحدًا')}

/* ٣) حل اللغز */
function stPuzzle(){const c=G.c,ord=['quiz','tl','con'],cur=ord.indexOf(G.sub);
  const prog=`<div class="subs">${['الأسئلة','الترتيب الزمني','الاستنتاج'].map((s,i)=>`<span class="${i<cur?'done':i===cur?'act':''}">${s}</span>`).join('')}</div>`;
  if(G.sub==='quiz'){const q=c.quiz[G.q];if(!G.qo)G.qo=shuffle(q.opts.map((_,i)=>i));
    return `<div class="paper plain">${prog}<span class="chip">سؤال ${AR(G.q+1)} من ${AR(c.quiz.length)}</span>
      <h3 class="q">${esc(q.q)}</h3><div class="opts">${G.qo.map(i=>`<button class="opt" onclick="ansQ(${i},this)">${esc(q.opts[i])}</button>`).join('')}</div>
      <div id="hintBox">${G.qh?`<div class="hintBox">💡 ${esc(q.hint||'استعيني بملف الأدلة')}</div>`:''}</div>
      ${G.qh?'':`<button class="btn ghost sm mt" onclick="hintQ()">💡 تلميح</button>`}</div>`}
  if(G.sub==='tl'){const n=c.timeline.length;if(!G.tl){G.tl=Array(n).fill(null);G.pool=shuffle(c.timeline.map((_,i)=>i))}
    const left=G.pool.filter(i=>!G.tl.includes(i));
    return `<div class="paper plain">${prog}<h3 class="q">🕰️ رتّبي الأحداث من الأقدم إلى الأحدث</h3>
      <p class="muted small">اضغطي على الحدث لوضعه في الخانة التالية، واضغطي على أي خانة لإرجاعه.</p>
      <div class="slots" id="slots">${G.tl.map((v,p)=>`<div class="slot ${v!=null?'fill':''} ${G.tlDone?'ok':''}" id="sl${p}" ${v!=null&&!G.tlDone?`onclick="unplace(${p})"`:''}><span class="n">${AR(p+1)}</span>${v!=null?`<span style="flex:1">${esc(c.timeline[v][1])}</span>${G.tlDone?`<span class="d">${esc(c.timeline[v][0])}</span>`:''}`:'<em>اختاري حدثًا</em>'}</div>`).join('')}</div>
      ${G.tlDone?`<p style="color:var(--green);font-weight:800">✓ ترتيب صحيح! لاحظي التواريخ التي ظهرت.</p><button class="btn mt" onclick="G.sub='con';renderCase()">إلى الاستنتاج الأخير ←</button>`
      :`<div class="pool">${left.map(i=>`<button class="tile" onclick="place(${i})">${esc(c.timeline[i][1])}</button>`).join('')}</div>
      <div class="row mt"><button class="btn" onclick="checkTl()" ${G.tl.includes(null)?'disabled':''}>تحقّقي من الترتيب</button><button class="btn ghost sm" onclick="hintTl()">💡 تلميح</button></div>`}</div>`}
  if(!G.co)G.co=shuffle(c.conclusion.map((_,i)=>i));
  return `<div class="paper folder" data-tab="الاستنتاج النهائي">${prog}<h3 class="q">🧠 ما الاستنتاج الصحيح الذي يحل لغز القضية؟</h3>
    <div class="mystery" style="font-size:15px">${esc(c.question)}</div>
    <div class="opts">${G.co.map(i=>`<button class="opt" onclick="ansC(${i},this)">${esc(c.conclusion[i])}</button>`).join('')}</div></div>`;
}
function ansQ(i,el){if(i===0){el.classList.add('ok');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    setTimeout(()=>{G.qo=null;G.qh=false;if(G.q<G.c.quiz.length-1)G.q++;else G.sub='tl';renderCase()},750)}
  else{miss();el.classList.add('bad','shake');el.disabled=true}}
function hintQ(){G.qh=true;useHint();renderCase()}
function place(i){const p=G.tl.indexOf(null);if(p<0)return;G.tl[p]=i;renderCase()}
function unplace(p){G.tl[p]=null;renderCase()}
function checkTl(){if(G.tl.includes(null))return;
  if(G.tl.every((v,p)=>v===p)){G.tlDone=true;renderCase();return}
  miss();G.tl.forEach((v,p)=>$('#sl'+p).classList.add(v===p?'ok':'bad'));
  toast('بعض الأحداث في غير مكانها — الصحيحة بقيت في أماكنها');
  setTimeout(()=>{G.tl=G.tl.map((v,p)=>v===p?v:null);renderCase()},1100)}
function hintTl(){const p=G.tl.findIndex((v,k)=>v!==k);if(p<0)return;
  const q=G.tl.indexOf(p);if(q>-1)G.tl[q]=null;G.tl[p]=p;useHint();renderCase();toast('💡 وضعنا لكِ حدثًا في مكانه الصحيح')}
function ansC(i,el){if(i===0){el.classList.add('ok');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);setTimeout(finish,900)}
  else{miss();el.classList.add('bad','shake');el.disabled=true}}

/* ٤) بطاقة المحققة */
function finish(){stopTimer();
  const sc=Math.max(30,100-G.mistakes*5-G.hints*10+(G.timeUp?0:20));
  const stars=sc>=100?3:sc>=75?2:1,st=student(),prev=st.solved[G.c.id];
  if(!prev||prev.score<sc)st.solved[G.c.id]={score:sc,stars,date:new Date().toISOString(),mistakes:G.mistakes,hints:G.hints};
  save();G.result={sc,stars,first:!prev};G.stage=4;renderCase();scrollTo({top:0,behavior:'smooth'})}
function stCert(){const c=G.c,r=G.result,cs=allCases(),idx=cs.findIndex(x=>x.id===c.id),nxt=cs[idx+1];
  const done=cs.filter(x=>student().solved[x.id]).length,rank=rankOf(done);
  return `<div class="cert" id="certPrint"><div class="inner">
    <span class="chip">مكتب التحقيقات التاريخية</span>
    <h2 style="margin-top:8px">بطاقة المحققة التاريخية</h2>
    <p class="muted">نشهد بأن المحققة</p>
    <div class="nm">${esc(me)}</div>
    <p>نجحت في حل <b>«${esc(c.title)}»</b> بمهارة في البحث والتحليل والاستنتاج</p>
    <div class="seal">${c.badge.icon}</div>
    <b class="kufi" style="font-size:19px">${esc(c.badge.name)}</b>
    <div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(3-r.stars)}</div>
    <div class="meta"><span>النقاط: <b>${AR(r.sc)}</b></span><span>الرتبة: <b>${rank[1]}</b></span><span>التاريخ: <b>${hijri(new Date())}</b></span></div>
    <div class="stamp done" style="border-color:var(--green);color:var(--green)">تم الحل</div>
  </div></div>
  <div class="paper plain summary"><h3>📝 ملخص القضية — احفظيه في ذاكرتك</h3><p style="margin-top:6px">${esc(c.summary||'')}</p>
    <p class="muted small mt">${G.timeUp?'انتهى الوقت قبل الحل، لذا لم تُضف نقاط السرعة.':'✨ حصلتِ على ٢٠ نقطة سرعة لأنكِ أنهيتِ قبل انتهاء الوقت.'} · الأخطاء: ${AR(G.mistakes)} · التلميحات: ${AR(G.hints)}</p></div>
  <div class="endbtns">
    ${nxt?`<button class="btn gold" onclick="openCase('${nxt.id}')">القضية التالية: ${esc(nxt.title)} ←</button>`:''}
    <button class="btn" onclick="window.print()">🖨️ طباعة الشهادة</button>
    <button class="btn ghost" onclick="G=null;renderHQ();show('hq')">العودة إلى المقر</button>
  </div>`}
function reviewEv(){openModal(`<h3>📂 ملف الأدلة</h3><div class="revlist">${G.c.evidence.map(e=>`<div><b>${e.icon||TICON[e.type]||'📁'} ${esc(e.title)}</b> <span class="chip">${esc(e.type)}</span><p>${esc(e.text)}</p></div>`).join('')}</div>`)}

/* ================= لوحة المعلمة ================= */
function teacher(){openModal(`<h3>🔐 لوحة المعلمة</h3><p class="muted">أدخلي الرمز السري للدخول.</p>
  <input class="inp mt" id="pin" type="password" inputmode="numeric" onkeydown="if(event.key==='Enter')chkPin()">
  <button class="btn mt" onclick="chkPin()">دخول</button><p class="muted small mt">الرمز الافتراضي: ١٢٣٤ — غيّريه من الإعدادات.</p>`);setTimeout(()=>$('#pin')?.focus(),50)}
function chkPin(){if(EN($('#pin').value.trim())===String(DB.settings.pin))tPanel('set');else toast('الرمز غير صحيح')}
function tPanel(tab){
  const cs=allCases(),T=[['set','الإعدادات'],['rec','سجل الطالبات'],['add','إضافة قضية']];
  let h=`<h3>👩‍🏫 لوحة المعلمة</h3><div class="tabs">${T.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tPanel('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
  if(tab==='set'){
    h+=`<label class="f">قضية الأسبوع <small>(تُفتح لجميع الطالبات وتظهر في المقر)</small></label>
    <select class="inp" id="sWeek">${cs.map(c=>`<option value="${c.id}" ${c.id===DB.settings.weekly?'selected':''}>${esc(c.code||'')} — ${esc(c.title)}</option>`).join('')}</select>
    <label class="f">ربط القضية بالمنهج <small>(يظهر تحت قضية الأسبوع)</small></label><input class="inp" id="sNote" value="${esc(DB.settings.note||'')}">
    <label class="f">مدة المؤقت بالدقائق</label><input class="inp" id="sMin" type="number" min="3" max="60" value="${DB.settings.minutes}">
    <label class="f">الرمز السري الجديد <small>(اتركيه فارغًا إن لم تريدي تغييره)</small></label><input class="inp" id="sPin" inputmode="numeric">
    <div class="row mt"><button class="btn" onclick="saveSet()">حفظ الإعدادات</button></div>
    ${DB.custom.length?`<h3 class="mt">القضايا المضافة</h3><table><tr><th>القضية</th><th></th></tr>${DB.custom.map(c=>`<tr><td>${esc(c.title)}</td><td><button class="btn sm red" onclick="delCase('${c.id}')">حذف</button></td></tr>`).join('')}</table>`:''}
    <div class="mt" style="border-top:1px solid rgba(42,33,25,.15);padding-top:12px"><button class="btn sm red" onclick="resetAll()">مسح سجل جميع الطالبات</button>
    <p class="muted small">يُحفظ التقدم على هذا الجهاز فقط.</p></div>`}
  if(tab==='rec'){const names=Object.keys(DB.students);
    h+=names.length?`<table><tr><th>الطالبة</th><th>القضايا</th><th>النقاط</th><th>الرتبة</th><th>الأوسمة</th></tr>${names.map(n=>{const s=DB.students[n].solved,ids=cs.filter(c=>s[c.id]);
      return `<tr><td><b>${esc(n)}</b></td><td>${AR(ids.length)}/${AR(cs.length)}</td><td>${AR(ids.reduce((a,c)=>a+s[c.id].score,0))}</td><td>${rankOf(ids.length)[1]}</td><td>${ids.map(c=>c.badge.icon).join(' ')||'—'}</td></tr>`}).join('')}</table>`
      :`<p class="muted mt">لا توجد طالبات مسجّلات على هذا الجهاز بعد.</p>`}
  if(tab==='add'){
    h+=`<p class="muted small">أضيفي قضية الأسبوع المرتبطة بالمنهج. افصلي بين الأجزاء بالرمز | وضعي كل عنصر في سطر.</p>
    <label class="f">عنوان القضية</label><input class="inp" id="fTitle">
    <div class="row"><div style="flex:1"><label class="f">الفترة / التاريخ</label><input class="inp" id="fEra"></div><div style="flex:1"><label class="f">المستوى</label><select class="inp" id="fLevel"><option>مستوى سهل</option><option>مستوى متوسط</option><option>مستوى متقدم</option></select></div></div>
    <label class="f">ملف القضية <small>(القصة التشويقية)</small></label><textarea class="inp" id="fBrief" rows="3"></textarea>
    <label class="f">اللغز <small>(السؤال الكبير)</small></label><input class="inp" id="fQ">
    <label class="f">الأدلة <small>النوع | العنوان | النص — الأنواع: شخصية، تاريخ، خريطة، صورة، وثيقة</small></label><textarea class="inp" id="fEv" rows="4" placeholder="شخصية | الإمام … | نص الدليل"></textarea>
    <label class="f">الربط <small>المعلومة | ما يناسبها (٢ على الأقل)</small></label><textarea class="inp" id="fMatch" rows="3" placeholder="الدرعية | العاصمة"></textarea>
    <label class="f">الأسئلة <small>السؤال | الإجابة الصحيحة | خطأ ١ | خطأ ٢ | تلميح (اختياري)</small></label><textarea class="inp" id="fQuiz" rows="3"></textarea>
    <label class="f">الخط الزمني <small>التاريخ | الحدث — بالترتيب الصحيح من الأقدم (٣ على الأقل)</small></label><textarea class="inp" id="fTl" rows="4"></textarea>
    <label class="f">الاستنتاج الصحيح</label><input class="inp" id="fC0">
    <label class="f">استنتاجان خاطئان</label><input class="inp" id="fC1"><input class="inp mt" id="fC2">
    <label class="f">ملخص القضية</label><textarea class="inp" id="fSum" rows="2"></textarea>
    <div class="row"><div style="flex:2"><label class="f">اسم الوسام</label><input class="inp" id="fBName" placeholder="وسام …"></div><div style="flex:1"><label class="f">رمز الوسام</label><input class="inp" id="fBIcon" value="🎖️" maxlength="4"></div></div>
    <button class="btn mt" onclick="addCase()">إضافة القضية</button>`}
  openModal(h);
}
function saveSet(){DB.settings.weekly=$('#sWeek').value;DB.settings.note=$('#sNote').value.trim();
  DB.settings.minutes=Math.min(60,Math.max(3,+EN($('#sMin').value)||10));const p=EN($('#sPin').value.trim());if(p)DB.settings.pin=p;
  save();toast('✓ حُفظت الإعدادات');if(me)renderHQ()}
function delCase(id){if(!confirm('حذف هذه القضية؟'))return;DB.custom=DB.custom.filter(c=>c.id!==id);if(DB.settings.weekly===id)DB.settings.weekly='c1';save();tPanel('set');if(me)renderHQ()}
function resetAll(){if(!confirm('سيُحذف تقدم جميع الطالبات على هذا الجهاز. متأكدة؟'))return;DB.students={};save();toast('تم مسح السجل');if(me){student();renderHQ()}tPanel('set')}
function addCase(){
  const v=id=>$('#'+id).value.trim();
  const L=id=>v(id).split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a[0]);
  const ev=L('fEv').map(a=>a.length>=3?{type:a[0],title:a[1],text:a.slice(2).join(' | ')}:{type:'وثيقة',title:a[0],text:a[1]||''});
  const match=L('fMatch').filter(a=>a[1]).map(a=>[a[0],a[1]]);
  const quiz=L('fQuiz').filter(a=>a.length>=4).map(a=>({q:a[0],opts:[a[1],a[2],a[3]],hint:a[4]||''}));
  const tl=L('fTl').filter(a=>a[1]).map(a=>[a[0],a[1]]);
  const con=[v('fC0'),v('fC1'),v('fC2')];
  if(!v('fTitle')||!v('fBrief'))return toast('أكملي العنوان وملف القضية');
  if(ev.length<2)return toast('أضيفي دليلين على الأقل');
  if(match.length<2)return toast('أضيفي سطرين على الأقل في الربط');
  if(!quiz.length)return toast('أضيفي سؤالًا واحدًا على الأقل بأربعة أجزاء');
  if(tl.length<3)return toast('أضيفي ثلاثة أحداث على الأقل في الخط الزمني');
  if(con.some(x=>!x))return toast('أكملي الاستنتاجات الثلاثة');
  const n=allCases().length+1,id='u'+Date.now();
  DB.custom.push({id,code:'القضية رقم '+AR(n),title:v('fTitle'),era:v('fEra')||'—',level:v('fLevel'),brief:v('fBrief'),question:v('fQ')||'اكتشفي حقيقة هذه القضية.',
    evidence:ev,match,quiz,timeline:tl,conclusion:con,summary:v('fSum'),badge:{icon:v('fBIcon')||'🎖️',name:v('fBName')||'وسام المحققة'}});
  if(confirm('أُضيفت القضية ✓ هل تريدين جعلها قضية الأسبوع؟'))DB.settings.weekly=id;
  save();if(me)renderHQ();tPanel('set');
}
</script>
</body>
</html>
